name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp lint
      - run: vp exec vue-tsc --noEmit
      - run: vp test run
      # Build + publint + attw gates (validates exports/types shape).
      - run: vp pack
