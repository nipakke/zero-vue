allowBuilds:
  "@rocicorp/zero-sqlite3": true
  esbuild: true
  protobufjs: true
packages:
  - .playground
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vitest: 4.1.10
  vite-plus: 0.2.8
overrides:
  vite: "catalog:"
  vitest: "catalog:"
versioning:
  # The playground is private — never versioned or published.
  ignore:
    - "@zero-vue/playground"
  changelog:
    # Keep committed CHANGELOG.md files per package instead of packing
    # changelogs only into published tarballs.
    storage: repository
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
