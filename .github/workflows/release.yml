name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          node-version: "24"
          cache: true

      - run: vp install

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # On push with pending intents: runs `pnpm version -r`, commits the bumps
      # + CHANGELOG + ledger, opens/updates the release PR.
      # When that PR merges (intents consumed): runs `pnpm ci:publish`, which
      # publishes only unpublished packages (safe no-op otherwise).
      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          commit: "chore: update versions"
          title: "chore: release packages"
          version: pnpm version -r
          publish: pnpm ci:publish
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
